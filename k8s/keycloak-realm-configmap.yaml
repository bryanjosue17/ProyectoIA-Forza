apiVersion: v1
data:
  keycloak-realm.json: |
    {
      "realm": "peopleportal",
      "enabled": true,
      "displayName": "PeoplePortal",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "resetPasswordAllowed": true,
      "roles": {
        "realm": [
          { "name": "employee", "description": "Colaborador" },
          { "name": "jefe_inmediato", "description": "Jefe inmediato" },
          { "name": "hr", "description": "Recursos Humanos" },
          { "name": "nomina", "description": "N├│mina" },
          { "name": "admin", "description": "Administrador" }
        ]
      },
      "clients": [
        {
          "clientId": "peopleportal-frontend",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:5173/*",
            "http://localhost:5174/*",
            "http://localhost:30081/*",
            "http://localhost:30082/*",
            "http://localhost:4200/*",
            "http://localhost:3000/*"
          ],
          "webOrigins": [
            "http://localhost:5173",
            "http://localhost:5174",
            "http://localhost:30081",
            "http://localhost:30082",
            "http://localhost:4200",
            "http://localhost:3000"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:30081/*\nhttp://localhost:30082/*"
          },
          "protocolMappers": [
            {
              "name": "audience-peopleportal-api",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "id.token.claim": "false",
                "access.token.claim": "true",
                "included.client.audience": "peopleportal-api"
              }
            }
          ]
        },
        {
          "clientId": "peopleportal-api",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "bearerOnly": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "users": [
        {
          "username": "testuser",
          "enabled": true,
          "email": "testuser@peopleportal.local",
          "firstName": "Test",
          "lastName": "User",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "test123",
              "temporary": false
            }
          ],
          "realmRoles": ["employee"]
        },
        {
          "username": "testmanager",
          "enabled": true,
          "email": "testmanager@peopleportal.local",
          "firstName": "Test",
          "lastName": "Manager",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "test123",
              "temporary": false
            }
          ],
          "realmRoles": ["employee", "jefe_inmediato"]
        },
        {
          "username": "testhr",
          "enabled": true,
          "email": "testhr@peopleportal.local",
          "firstName": "Test",
          "lastName": "HR",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "test123",
              "temporary": false
            }
          ],
          "realmRoles": ["employee", "hr"]
        },
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@peopleportal.local",
          "firstName": "PeoplePortal",
          "lastName": "Admin",
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ],
          "realmRoles": ["employee", "admin"]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: peopleportal
